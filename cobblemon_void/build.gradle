plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
}

version = project.mod_version
group = 'com.cobblemonvoid'

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Cobblemon and Mega Showdown from Modrinth's maven (version = Modrinth "version number")
    modImplementation "maven.modrinth:cobblemon:${project.cobblemon_version}"
    modImplementation "maven.modrinth:cobblemon-mega-showdown:${project.msd_version}"
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar() }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
